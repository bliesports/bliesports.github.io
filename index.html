<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Site Güncelleme</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: 'Inter', sans-serif;
            color: #111111;
        }

        .container {
            width: 100%;
            padding: 30px 20px;
            text-align: center;
        }

        .logo {
            display: block;
            width: 190px;
            height: 190px;
            object-fit: contain;
            margin: 0 auto 28px;
        }

        h1 {
            font-size: clamp(22px, 4vw, 32px);
            font-weight: 600;
            letter-spacing: -1.2px;
            line-height: 1.4;
            color: #111111;
        }

        @media (max-width: 480px) {
            .logo {
                width: 155px;
                height: 155px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <img
            src="file_0000000066d082109b6183ac2e01b73d.png"
            alt="Logo"
            class="logo"
        >

        <h1>Site Güncelleme Durumundadır.Lütfen Daha Sonra Tekrar Deneyiniz.Teşekkür ederiz.</h1>
    </main>

</body>
</html>
